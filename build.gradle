plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

base {
    archivesName = 'controlflex-api'
}

version = api_version
group = maven_group

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.1'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'controlflex-api'
        }
        // 与 JitPack 对外坐标一致 (com.github.ControlFlexMC:control-flex-api)。
        // 使 publishToMavenLocal 在本地也能按生产坐标解析，便于先本地验证再发版。
        jitpackCoords(MavenPublication) {
            from components.java
            groupId = 'com.github.ControlFlexMC'
            artifactId = 'control-flex-api'
        }
    }
}
