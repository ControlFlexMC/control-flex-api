plugins {
    id 'java-library'
    id 'maven-publish'
}

// ─────────────────────────────────────────────
// Java Compatibility
//
// The published API must stay loadable on a Java 8 JVM, so classes compile for
// major 52 against the Java 8 API set.
//
// On JDK 9+ `--release 8` does both: it targets 1.8 *and* checks against the
// Java 8 signature table, so a Java 9+ API (String.isBlank, Path.of, List.of)
// fails the build here instead of throwing NoSuchMethodError at runtime.
// `--release` does not exist on JDK 8 and is not needed there — that javac's
// own rt.jar already is the Java 8 API set.
// ─────────────────────────────────────────────
def javaSourceCompat = JavaVersion.toVersion(findProperty('javaSourceCompatibility') ?: '1.8')
def javaTargetCompat = JavaVersion.toVersion(findProperty('javaTargetCompatibility') ?: '1.8')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Targeting 8 is deliberate, so javac's "source value 8 is obsolete"
    // warnings are noise.
    options.compilerArgs << '-Xlint:-options'
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = javaTargetCompat.majorVersion.toInteger()
    }
}

if (!JavaVersion.current().isJava9Compatible()) {
    java {
        sourceCompatibility = javaSourceCompat
        targetCompatibility = javaTargetCompat
    }
}

java {
    withSourcesJar()
}

base {
    archivesName = 'controlflex-api'
}

version = api_version
group = maven_group

def generatedApiVersionDir = layout.buildDirectory.dir('generated/sources/apiVersion')

sourceSets {
    main {
        java {
            srcDir generatedApiVersionDir
        }
    }
}

tasks.register('generateApiVersion') {
    def version = providers.provider { api_version.toString() }
    inputs.property('apiVersion', version)
    outputs.dir generatedApiVersionDir
    doLast {
        def escaped = version.get().replace('\\', '\\\\').replace('"', '\\"')
        def pkgDir = new File(generatedApiVersionDir.get().asFile, 'com/ifels/controlflex/api')
        pkgDir.mkdirs()
        new File(pkgDir, 'ApiVersion.java').text = """\
package com.ifels.controlflex.api;

final class ApiVersion {
    static final String VALUE = "${escaped}";

    private ApiVersion() {}
}
"""
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn 'generateApiVersion'
}

tasks.named('sourcesJar', Jar) {
    dependsOn 'generateApiVersion'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        // Single publication at the JitPack consumer coordinate.
        // Two publications made JitPack emit a wrapper POM that depends on both
        // jars; one publication keeps mavenLocal and JitPack on the same artifact.
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.ControlFlexMC'
            artifactId = 'control-flex-api'
        }
    }
}
