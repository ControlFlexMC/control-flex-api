java_version=17
# Bytecode target for the published API jar.
#
# This is a *bridge* library: ControlFlex bundles it into the mod jar, and third-party
# bridge mods compile against it. Targeting the lowest JVM that any consumer needs keeps
# one artifact usable everywhere:
#   - MC 1.17.1 requires Java 16 (Mojang: javaVersion.majorVersion=16)
#   - MC 1.18+ requires Java 17, 1.21+ requires Java 21
#   - a possible 1.16.5 backport would be Java 8
# Java 8 bytecode loads on all of them, so the API must not use Java 9+ language features
# (no private interface methods, no List.of/Set.of/Map.of, no Optional.isEmpty, no var...).
api_target_java=8
maven_group=com.ifels.controlflex
api_version=0.8.9
# Uncomment and set this if Gradle can't find Java (e.g. macOS with multiple JDKs).
# On CI/JitPack, rely on JAVA_HOME environment variable instead.
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/microsoft-21.jdk/Contents/Home
